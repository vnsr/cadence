<title>Cadence</title>
<style>
/* Layout: header and tab bar stay put; only <main> scrolls. iPhone standalone PWAs otherwise let the whole page
   rubber-band, which drags a position:fixed tab bar along. Keep this in every app built on this core. */
:root{--bg:#F6F3EC;--surface:#FFFFFF;--surface2:#EEE9DE;--ink:#1F1B15;--muted:#6E675B;--line:#E3DDD0;--ok:#2B8A5E;--warn:#B57A00;--danger:#C2392F;--on:#FFFFFF;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13110D;--surface:#1D1A15;--surface2:#29251E;--ink:#EDE8DE;--muted:#9C9484;--line:#332E26;--ok:#4DBB89;--warn:#F2B83A;--danger:#F0685C;--on:#13110D;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#13110D;--surface:#1D1A15;--surface2:#29251E;--ink:#EDE8DE;--muted:#9C9484;--line:#332E26;--ok:#4DBB89;--warn:#F2B83A;--danger:#F0685C;--on:#13110D;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:ui-rounded,"SF Pro Rounded",-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.4;font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent;position:fixed;inset:0;overflow:hidden;overscroll-behavior:none;display:flex;flex-direction:column}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
header.top{position:relative;flex:none;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 8px;display:flex;align-items:center;gap:10px}
.who{flex:1;min-width:0;text-align:left}.who h1{font-size:24px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.15}
.who p{font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);flex:none;position:relative}
.icon-btn svg{width:20px;height:20px}
.icon-btn.alert::after{content:"";position:absolute;top:2px;right:2px;width:10px;height:10px;border-radius:50%;background:var(--danger);border:2px solid var(--bg)}
main{flex:1;min-height:0;width:100%;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;padding:4px max(16px,calc((100% - 528px)/2)) 28px}
nav.tabs{position:relative;flex:none;z-index:6;display:flex;justify-content:center;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.tab{flex:1;max-width:110px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);padding:4px 0;position:relative}
.tab svg{width:24px;height:24px}.tab.on{color:var(--ink);font-weight:600}
.tab .badge{position:absolute;top:0;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--danger);color:#fff;font-size:11px;font-style:normal;font-weight:700;line-height:18px;text-align:center}
.tab.add{color:var(--on)}.tab.add span.plus{width:46px;height:46px;border-radius:50%;background:var(--acc);display:grid;place-items:center;margin-top:-18px;box-shadow:0 4px 14px color-mix(in srgb,var(--acc) 40%,transparent)}
.tab.add span.plus svg{width:26px;height:26px}.tab.add em{font-style:normal;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px 16px;margin-bottom:12px}
.card h3{font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px}.card h3 .r{margin-left:auto;font-weight:600;font-size:14px;color:var(--muted)}
.card h3 svg{width:18px;height:18px;color:var(--acc)}
.chip{padding:7px 12px;border-radius:999px;background:var(--surface2);font-size:14px;font-weight:600;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.chip.on{background:var(--ink);color:var(--bg)}.chip.a{background:color-mix(in srgb,var(--acc) 14%,var(--surface));color:var(--acc)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips.scroll .chip{flex:none;max-width:none}.chips.scroll{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:2px}.chips.scroll::-webkit-scrollbar{display:none}
.btn{flex:1;padding:13px 10px;border-radius:14px;background:var(--surface2);font-weight:600;text-align:center;font-size:16px}
.btn.primary{background:var(--acc);color:var(--on)}.btn.dark{background:var(--ink);color:var(--bg)}
.btn.small{flex:none;padding:9px 14px;font-size:15px}.btn.danger{color:var(--danger)}.btn:disabled{opacity:.45}
.btn svg{width:16px;height:16px;vertical-align:-3px;margin-right:5px}
.row-btns{display:flex;gap:8px}
.link{display:block;margin:10px auto 0;color:var(--muted);font-size:14px;text-decoration:underline;text-underline-offset:3px}
.muted{color:var(--muted);font-size:14px}.small{font-size:13px}
.empty{text-align:center;color:var(--muted);padding:28px 10px;font-size:15px;line-height:1.5}
.nudge{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:10px;font-size:14px}.nudge span{flex:1}
.nudge.err{border-color:var(--danger);color:var(--danger)}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.38);z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--bg);border-radius:22px 22px 0 0;max-height:94vh;max-height:94dvh;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .24s cubic-bezier(.2,.8,.2,1);max-width:600px;margin:0 auto}
.sheet.on{transform:none}.sheet.full{height:94vh;height:94dvh}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 2px;flex:none}
.sh-head{display:flex;align-items:center;gap:8px;padding:6px 16px 8px;flex:none}.sh-head h2{flex:1;font-size:19px;font-weight:700;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh-head .icon-btn{width:36px;height:36px}.sh-head .icon-btn svg{width:18px;height:18px}
.sh-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 16px calc(18px + env(safe-area-inset-bottom,0px));flex:1}
.sh-foot{padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--bg);flex:none}
.search{display:flex;gap:8px;align-items:center;margin:0 0 10px}
.search .in{flex:1;position:relative}.search input{width:100%;padding:11px 12px 11px 38px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-size:16px;-webkit-appearance:none;appearance:none}
.search .in svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
.sec{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:14px 2px 6px;display:flex;align-items:center;gap:8px}
.sec .r{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:600}
.fld{display:block;margin-bottom:12px}.fld>span{display:block;font-size:13px;color:var(--muted);margin-bottom:5px;font-weight:600}
.fld input,.fld select,.fld textarea{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:16px;-webkit-appearance:none;appearance:none;min-height:44px}
.fld textarea{min-height:84px;resize:vertical;line-height:1.4}
.fld select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.tog{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.tog span{flex:1}.tog small{display:block;color:var(--muted);font-size:13px}
.sw{width:50px;height:30px;border-radius:15px;background:var(--surface2);position:relative;flex:none;transition:background .15s;border:1px solid var(--line)}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s}
.sw.on{background:var(--ok);border-color:var(--ok)}.sw.on::after{transform:translateX(20px)}
.set-sec{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:20px 0 6px}
.list{list-style:none;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:12px}
.list li+li{border-top:1px solid var(--line)}.list .it{width:100%;display:flex;align-items:center;gap:10px;padding:11px 14px;text-align:left;min-height:52px}
.list .nm{flex:1;min-width:0}.list .nm b{display:block;font-weight:600;font-size:15.5px;line-height:1.3}.list .nm small{display:block;color:var(--muted);font-size:13px;margin-top:1px}
.list .end{text-align:right;flex:none;font-size:13px;color:var(--muted)}.list .end b{display:block;font-size:15px;color:var(--ink)}
.stack{display:flex;flex-wrap:wrap;gap:8px}
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:3px;margin-bottom:12px}.seg button{flex:1;padding:8px 6px;border-radius:9px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.chart{width:100%;height:auto;display:block}.chart text{font-size:10px;fill:var(--muted)}.chart .gl{stroke:var(--line);stroke-width:1}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}.stat div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.stat span{display:block;font-size:12px;color:var(--muted)}.stat b{font-size:20px}.stat small{color:var(--muted);font-size:12px;margin-left:4px}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:14px;font-size:14.5px;font-weight:600;z-index:40;opacity:0;pointer-events:none;transition:all .2s;max-width:calc(100vw - 32px);display:flex;gap:12px;align-items:center}
.toast.on{opacity:1;transform:translateX(-50%);pointer-events:auto}.toast button{color:var(--acc);font-weight:700;text-decoration:underline}
.hint{font-size:12.5px;color:var(--muted);margin-top:-6px;margin-bottom:12px;line-height:1.45}
.warn{background:color-mix(in srgb,var(--warn) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--warn) 35%,var(--line));border-radius:12px;padding:9px 12px;font-size:13.5px;margin-bottom:12px}
.calc{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:14px;color:var(--muted);margin-bottom:12px;line-height:1.5}.calc b{color:var(--ink)}
.spin{display:inline-block;width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-3px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
.days{display:inline-block;min-width:54px;text-align:center;padding:4px 8px;border-radius:999px;font-size:12.5px;font-weight:700;background:var(--surface2);color:var(--muted)}
.days.red{background:color-mix(in srgb,var(--danger) 15%,var(--surface));color:var(--danger)}.days.amb{background:color-mix(in srgb,var(--warn) 18%,var(--surface));color:var(--warn)}
.days.ok{background:color-mix(in srgb,var(--ok) 14%,var(--surface));color:var(--ok)}
.bar{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden}.bar i{display:block;height:100%;border-radius:4px;background:var(--c,var(--acc))}

:root{--acc:#2F6FBA}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--acc:#6AA2E6}}
:root[data-theme="dark"]{--acc:#6AA2E6}
.datebar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px 0 10px}
.datebar button.nav{width:38px;height:38px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center}
.datebar button.nav svg{width:18px;height:18px}.datebar button.nav:disabled{opacity:.35}
.datebar .dl{flex:1;text-align:center;font-weight:700;font-size:17px}.datebar .dl small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:12px}
.strip button{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 0 7px;display:flex;flex-direction:column;align-items:center;gap:1px}
.strip small{font-size:11px;color:var(--muted);font-weight:600}.strip b{font-size:16px}
.strip i{width:70%;height:4px;border-radius:2px;margin-top:3px;background:linear-gradient(90deg,var(--acc) calc(var(--d)*100%),color-mix(in srgb,var(--acc) 30%,var(--surface2)) calc(var(--d)*100%) calc(var(--p)*100%),var(--surface2) calc(var(--p)*100%))}
.strip button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}.strip button.on small{color:inherit;opacity:.75}
.strip button.td:not(.on){border-color:var(--acc)}
.focus{background:color-mix(in srgb,var(--acc) 9%,var(--surface));border:1px solid color-mix(in srgb,var(--acc) 30%,var(--line));border-radius:16px;padding:10px 14px;margin-bottom:12px;font-size:14.5px}
.focus>b{display:flex;align-items:center;gap:6px;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--acc)}.focus svg{width:16px;height:16px}.focus ol{padding-left:20px;margin-top:4px}
.run{display:flex;align-items:center;gap:12px;border-left:5px solid var(--c)}.run .nm{flex:1;min-width:0}.run .nm b{display:block}.run .nm small{color:var(--muted);font-size:13px}.run .el{font-size:18px}
.pulse{width:12px;height:12px;border-radius:50%;background:var(--c);flex:none;animation:pu 1.6s ease-in-out infinite}@keyframes pu{50%{opacity:.25}}
.chip.track{display:inline-flex;align-items:center;gap:5px;background:color-mix(in srgb,var(--c) 14%,var(--surface));color:color-mix(in srgb,var(--c) 85%,var(--ink))}.chip.track svg{width:12px;height:12px}
.chip.area{border:2px solid transparent;background:color-mix(in srgb,var(--c) 14%,var(--surface));color:color-mix(in srgb,var(--c) 85%,var(--ink))}.chip.area.on{background:var(--c);color:#fff}
.tl{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;cursor:copy;margin-bottom:4px}
.tl .hr{position:absolute;left:0;right:0;border-top:1px solid var(--line);pointer-events:none}.tl .hr span{position:absolute;left:8px;top:-1px;font-size:11px;color:var(--muted);background:var(--surface);padding:0 3px;transform:translateY(-50%)}
.tl .hr:first-child{border-top:0}.tl .hr:first-child span{transform:none;top:2px}
.blk{position:absolute;border-radius:10px;padding:4px 8px;text-align:left;overflow:hidden;background:color-mix(in srgb,var(--c) 18%,var(--surface));border:1.5px dashed color-mix(in srgb,var(--c) 70%,transparent);color:var(--ink);cursor:pointer}
.blk b{display:block;font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:16px}.blk small{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk.done{background:var(--c);border:1.5px solid var(--c);color:#fff}.blk.done small{color:rgba(255,255,255,.85)}
.blk.skip{opacity:.45;border-style:solid}.blk.skip b{text-decoration:line-through}
.blk .ck{position:absolute;top:4px;right:5px}.blk .ck svg{width:14px;height:14px;stroke-width:3}
.now{position:absolute;left:40px;right:0;height:2px;background:var(--danger);pointer-events:none}.now::before{content:"";position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--danger)}
.arealist{display:grid;gap:10px;margin-top:10px}.lr{display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px;gap:8px}.lr span{color:var(--muted);display:flex;align-items:center;gap:6px}
.sw2{display:inline-block;width:10px;height:10px;border-radius:3px;flex:none;margin-right:6px}
.bar2{position:relative;height:10px;border-radius:5px;background:var(--surface2)}.bar2 i{position:absolute;left:0;top:0;bottom:0;border-radius:5px}.bar2 i.p{opacity:.3}
.bar2 em{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);border-radius:1px;opacity:.7}
.wgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:10px}.wcol{display:flex;flex-direction:column;align-items:center;gap:4px}
.wcol small{font-size:11px;color:var(--muted);font-weight:600}.wcol b{font-size:12.5px}.wcol.td small{color:var(--acc)}
.wbar{position:relative;width:100%;height:150px;background:var(--surface2);border-radius:8px;overflow:hidden}.wbar i{position:absolute;left:3px;right:3px;border-radius:3px}.wbar i.plan{opacity:.35}.wbar i.skip{opacity:.12}
.list .it input.ar-name{flex:1;min-width:0;border:0;background:none;font-size:15.5px;font-weight:600;padding:6px 0}
input.mini{width:60px;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--bg);text-align:right;font-size:16px}
.chips input.mini{height:34px;padding:6px 8px}
.swatch{width:26px;height:26px;border-radius:8px;flex:none}.icon-btn.sm{width:36px;height:36px}.icon-btn.sm svg{width:17px;height:17px}
.hitlist{display:flex;flex-wrap:wrap;gap:6px}.hit{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;font-size:13px;font-weight:600;background:var(--surface2)}
.hit i{width:8px;height:8px;border-radius:50%}.hit.ok{background:color-mix(in srgb,var(--ok) 15%,var(--surface));color:var(--ok)}.hit.miss{color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted);margin-top:6px}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

.facts span{display:flex;align-items:center;color:var(--muted)}.facts small{font-weight:500;color:var(--muted)}.okc{color:var(--ok)!important}.red{color:var(--danger)!important}

<body>
<header class="top">
  <button class="who" data-act="noop" aria-label="Cadence"><h1 id="hName">Cadence</h1><p id="hSub"></p></button>
  <button class="icon-btn" id="gearBtn" data-act="settings" aria-label="Settings"></button>
</header>
<main id="main"></main>
<nav class="tabs" id="tabs"></nav>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast" role="status"></div>
<input type="file" id="fileIn" accept=".json,application/json" hidden>

<script>
/* ===== Shared core (Yupu/Thali family): storage, sheets, settings, backup and GitHub sync =====
   Each app defines APP before this block:
   APP={id,name,version,date,dir,colls:{name:{shard?:rec=>string}},settings:{},tabs:[[key,label,icon]],
        main(tab),mount?(tab),headerTitle?(),headerSub?(),tabBadge?(key),appBadge?(),settingsTop?(),about,
        addAction?, onMerged?(), init?(), syncNote?} */
'use strict';

/* ---------- state & storage ---------- */
let COLLS=[];
function blank(){const o={v:1,settings:{device:'',theme:'auto',lastBackup:0,...(APP.settings||{})},sync:{repo:'',token:'',on:false,shas:{},dirty:{},last:0,err:''}};COLLS.forEach(c=>o[c]=[]);return o;}
function hydrate(d){const b=blank(),o={...b,...d,settings:{...b.settings,...(d.settings||{})},sync:{...b.sync,...(d.sync||{})}};COLLS.forEach(c=>o[c]=Array.isArray(d[c])?d[c]:[]);return o;}
let S=null,IDB=null,storeMode='idb',saving=false,saveAgain=false;
const LSKEY=()=>APP.id+'-state';
function idbOpen(){return new Promise((res,rej)=>{try{if(!window.indexedDB)return rej(new Error('none'));const r=indexedDB.open(APP.id,1);
  r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('kv'))r.result.createObjectStore('kv');};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);r.onblocked=()=>rej(new Error('blocked'));}catch(e){rej(e);}});}
function idbGet(k){return new Promise((res,rej)=>{const q=IDB.transaction('kv','readonly').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);});}
function idbPut(k,v){return new Promise((res,rej)=>{const tx=IDB.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error);});}
function idbDel(k){return new Promise((res)=>{try{const tx=IDB.transaction('kv','readwrite');tx.objectStore('kv').delete(k);tx.oncomplete=()=>res();tx.onerror=()=>res();}catch(e){res();}});}
async function loadState(){
  try{IDB=await idbOpen();const d=await idbGet('state');return d?hydrate(d):blank();}
  catch(e){storeMode='ls';IDB=null;try{const raw=localStorage.getItem(LSKEY());if(raw)return hydrate(JSON.parse(raw));}catch(_){}return blank();}
}
function saveLS(){try{localStorage.setItem(LSKEY(),JSON.stringify(S));}catch(e){toast('This phone refused to save. Back up now.');}}
function save(){
  if(storeMode!=='idb'||!IDB)return saveLS();
  if(saving){saveAgain=true;return;}
  saving=true;let p;try{p=idbPut('state',S);}catch(e){p=Promise.reject(e);}
  p.then(()=>{saving=false;if(saveAgain){saveAgain=false;save();}}).catch(()=>{saving=false;storeMode='ls';saveLS();});
}
function touch(o){o.updatedAt=Date.now();o.by=S.settings.device||'';return o;}
const live=c=>S[c].filter(x=>!x.deleted);

function fileKey(c,r){const sh=APP.colls[c].shard;return sh?c+'-'+sh(r):c;}
function putRec(c,r){
  const i=S[c].findIndex(x=>x.id===r.id);
  if(i>=0){const old=S[c][i];const ok=fileKey(c,old);if(ok!==fileKey(c,r))markDirty(ok);S[c][i]=r;}else S[c].push(r);
  touch(r);markDirty(fileKey(c,r));save();return r;
}
function delRec(c,id,label){

/* ---------- backup / import ---------- */
const stamp=()=>{const d=new Date();return `${dayKey(d)}_${pad(d.getHours())}${pad(d.getMinutes())}`;};
async function shareFile(name,data,mime){
  const file=new File([data],name,{type:mime});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return true;}}catch(e){if(e&&e.name==='AbortError')return false;}
  const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);return true;
}
async function shareText(title,text){

  try{await navigator.clipboard.writeText(text);toast('Copied');}catch(e){toast('Could not share');}
}
async function doBackup(){
  const body={app:APP.id,kind:'backup',version:APP.version,exportedAt:Date.now(),device:S.settings.device};COLLS.forEach(c=>body[c]=S[c]);
  const dev=(S.settings.device||'').replace(/[^\w-]+/g,'');
  if(await shareFile(`${APP.id}-backup-${stamp()}${dev?'-'+dev:''}.json`,JSON.stringify(body),'application/json')){S.settings.lastBackup=Date.now();save();toast('Backup ready');}
}
function mergeList(target,incoming,onChange){
  const idx=new Map(target.map((x,i)=>[x.id,i]));let n=0;
  for(const r of incoming||[]){if(!r||!r.id)continue;const i=idx.get(r.id);
    if(i==null){target.push(r);idx.set(r.id,target.length-1);n++;onChange&&onChange(null,r);}
    else if((r.updatedAt||0)>(target[i].updatedAt||0)){const old=target[i];target[i]=r;n++;onChange&&onChange(old,r);}}
  return n;
}
async function importFile(file){
  let d;try{d=JSON.parse(await file.text());}catch(e){return toast(`That file is not a ${APP.name} backup.`);}
  if(!d||d.app!==APP.id)return toast(`That file is not a ${APP.name} backup.`);
  let n=0;
  for(const c of COLLS)n+=mergeList(S[c],d[c],(o,r)=>{markDirty(fileKey(c,r));if(o&&fileKey(c,o)!==fileKey(c,r))markDirty(fileKey(c,o));});
  if(APP.onMerged)APP.onMerged();
  save();closeSheet();toast(`Imported: ${n} records added or updated`);
}

/* ---------- automatic sync via a private GitHub repository ----------
   <dir>/<collection>[-<shard>].json — records merged by id + updatedAt; deletions travel as flags.
   Push rewrites only files changed on this phone, using the file's version (sha) as a lock. */
let syncing=false,syncTimer=null,syncAgain=false;
function markDirty(...keys){if(!S.sync)return;S.sync.dirty=S.sync.dirty||{};keys.forEach(k=>{if(k)S.sync.dirty[k]=1;});scheduleSync();}
function scheduleSync(ms=15000){if(!S.sync||!S.sync.on)return;clearTimeout(syncTimer);syncTimer=setTimeout(()=>autoSync(),ms);}
function normRepo(v){return String(v||'').trim().replace(/^https?:\/\/github\.com\//i,'').replace(/\.git$/,'').replace(/^\/+|\/+$/g,'');}
async function gh(path,{method='GET',body,accept,repo,token}={}){
  const s=S.sync;
  return fetch('https://api.github.com/repos/'+(repo||s.repo)+path,{method,cache:'no-store',body,
    headers:{'Authorization':'Bearer '+(token||s.token),'Accept':accept||'application/vnd.github+json',...(body?{'Content-Type':'application/json'}:{})}});
}
function b64enc(str){const b=new TextEncoder().encode(str);let s='';for(let i=0;i<b.length;i+=0x8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(s);}
function syncErrText(st){
  if(st===401)return 'GitHub rejected the token. It may have expired: turn sync off and on with a new token.';
  if(st===403)return 'The token is missing write access (Contents: Read and write), or GitHub is limiting requests.';
  if(st===404)return 'Repository not found, or this token has no access to it.';
  if(st==='conflict')return 'Both phones were syncing at once. Will retry shortly.';
  if(st==='net')return 'Could not reach GitHub. Will retry when online.';
  return 'GitHub error '+st+'. Will retry.';
}
function agoText(ts){const m=Math.round((Date.now()-ts)/6e4);return m<1?'just now':m<60?`${m} min ago`:m<1440?`${Math.round(m/60)} h ago`:`${Math.round(m/1440)} days ago`;}
function syncStatus(){const s=S.sync;if(!s.on)return 'Off';if(syncing)return 'Syncing…';if(s.err)return s.err;if(!navigator.onLine)return 'Offline. Will sync when online.';return s.last?`Synced ${agoText(s.last)}`:'Waiting for first sync';}
function setSyncUI(){const el=$('#syncStatus');if(el){el.textContent=syncStatus();el.closest('.nudge')?.classList.toggle('err',!!S.sync.err);}$('#gearBtn').classList.toggle('alert',!!(S.sync.on&&S.sync.err));}
function collOfKey(k){return COLLS.find(c=>k===c||k.startsWith(c+'-'));}
function fileFor(k){const c=collOfKey(k);return JSON.stringify({app:APP.id,kind:'coll',coll:c,key:k,records:S[c].filter(r=>fileKey(c,r)===k)});}
function mergeRemote(obj){
  if(!obj||obj.app!==APP.id||obj.kind!=='coll'||!APP.colls[obj.coll])return false;
  const c=obj.coll;return mergeList(S[c],obj.records,(o,r)=>{if(o&&fileKey(c,o)!==fileKey(c,r))S.sync.dirty[fileKey(c,o)]=1;})>0;
}
async function autoSync(){
  const s=S.sync;if(!s.on||!s.repo||!s.token)return;
  if(syncing){syncAgain=true;return;}
  if(!navigator.onLine){setSyncUI();return;}
  syncing=true;setSyncUI();let changed=false;
  try{
    for(let attempt=0;;attempt++){
      const lr=await gh('/contents/'+APP.dir);let list=[];
      if(lr.status===404){const rr=await gh('');if(!rr.ok)throw rr.status;}
      else if(!lr.ok)throw lr.status;
      else list=(await lr.json()).filter(f=>f.type==='file'&&/\.json$/.test(f.name));
      const remote={};list.forEach(f=>remote[f.name]=f.sha);
      for(const f of list){
        if(s.shas[f.name]===f.sha)continue;
        const fr=await gh('/contents/'+APP.dir+'/'+encodeURIComponent(f.name),{accept:'application/vnd.github.raw+json'});
        if(!fr.ok)throw fr.status;
        try{if(mergeRemote(JSON.parse(await fr.text())))changed=true;}catch(e){}
        s.shas[f.name]=f.sha;
      }
      if(changed&&APP.onMerged)APP.onMerged();
      save();
      let clash=false;
      for(const k of Object.keys(s.dirty||{})){
        const name=k+'.json',c=collOfKey(k);
        if(!c||(!remote[name]&&!S[c].some(r=>fileKey(c,r)===k))){delete s.dirty[k];continue;}
        const pr=await gh('/contents/'+APP.dir+'/'+encodeURIComponent(name),{method:'PUT',body:JSON.stringify({message:`${S.settings.device||APP.name}: ${k}`,content:b64enc(fileFor(k)),...(remote[name]?{sha:remote[name]}:{})})});
        if(pr.status===409||pr.status===422){clash=true;break;}
        if(!pr.ok)throw pr.status;
        const j=await pr.json();s.shas[name]=remote[name]=j.content.sha;delete s.dirty[k];save();
      }
      if(!clash)break;
      if(attempt>=3)throw 'conflict';
      await new Promise(r=>setTimeout(r,800+Math.random()*1200));
    }
    if(APP.afterSync)await APP.afterSync();
    s.last=Date.now();s.err='';
  }catch(e){s.err=syncErrText(e instanceof TypeError?'net':e);}
  finally{
    syncing=false;save();
    if(changed&&!sheetOpen()&&!(document.activeElement&&document.activeElement.matches('#main input,#main textarea')))render();else if(changed){renderHeader();renderTabs();}
    setSyncUI();
    if(syncAgain){syncAgain=false;scheduleSync(2000);}
  }
}
async function syncTurnOn(){

  if(!/^[\w.-]+\/[\w.-]+$/.test(repo))return toast('Enter the repository as username/repository-name.');
  if(!token)return toast('Paste the access token.');

/* ---------- calendar (.ics) ---------- */
function icsEsc(s){return String(s||'').replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/[,;]/g,m=>'\\'+m);}
function icsFold(l){const out=[];while(l.length>74){out.push(l.slice(0,74));l=' '+l.slice(74);}out.push(l);return out.join('\r\n');}
const icsDate=k=>k.replace(/-/g,'');
const icsStamp=()=>new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
// events: [{uid,day,end?,title,desc,alarms:[daysBefore...],start?:min,dur?:min}]
function icsBuild(events,calName){
  const L=['BEGIN:VCALENDAR','VERSION:2.0',`PRODID:-//${APP.name}//EN`,'CALSCALE:GREGORIAN','METHOD:PUBLISH',`X-WR-CALNAME:${icsEsc(calName||APP.name)}`];
  for(const e of events){
    L.push('BEGIN:VEVENT',`UID:${e.uid}@${APP.id}`,`DTSTAMP:${icsStamp()}`);
    if(e.start!=null){const t=x=>icsDate(e.day)+'T'+pad(Math.floor(x/60))+pad(x%60)+'00';L.push(`DTSTART:${t(e.start)}`,`DTEND:${t(e.start+(e.dur||60))}`);}
    else L.push(`DTSTART;VALUE=DATE:${icsDate(e.day)}`,`DTEND;VALUE=DATE:${icsDate(addDay(e.end||e.day,1))}`);
    L.push(icsFold('SUMMARY:'+icsEsc(e.title)));if(e.desc)L.push(icsFold('DESCRIPTION:'+icsEsc(e.desc)));
    // timed events: alarm d minutes before; all-day events: alarm at 09:00, d days before
    for(const d of (e.alarms||[]))L.push('BEGIN:VALARM','ACTION:DISPLAY',icsFold('DESCRIPTION:'+icsEsc(e.title)),
      e.start!=null?`TRIGGER:-PT${d}M`:d<=0?'TRIGGER:PT9H':`TRIGGER:-P${d-1}DT15H`,'END:VALARM');
    L.push('END:VEVENT');
  }
  L.push('END:VCALENDAR');return L.join('\r\n');
}

function saveBlock(){
  readBD();const b=BD;if(!b.area)return toast('Pick an area.');if(!isDay(b.day))return toast('Pick a day.');
  const rec={id:b.id||uid(),day:b.day,start:b.start,dur:+b.dur||60,area:b.area,title:(b.title||'').trim(),status:b.status,actual:b.status==='done'&&+b.actual>0?+b.actual:'',note:(b.note||'').trim()};
  if(b.src)rec.src=b.src;
  putRec('blocks',rec);
  for(const d of b.copyTo)putRec('blocks',{...rec,id:uid(),day:d,status:'plan',actual:'',note:''});
  VW.day=rec.day;BD=null;closeSheet();if(b.copyTo.length)toast(`Saved, plus ${plural(b.copyTo.length,'copy','copies')}`);
}

/* ---------- week view ---------- */
function weekHtml(){
  const mon=VW.mon,days=weekDays(mon),st=weekStats(mon),[y,w]=isoWeek(mon);
  let h=`<div class="datebar"><button class="nav" data-act="wk-nav" data-d="-1" aria-label="Previous week">${I.left}</button><button class="dl" data-act="wk-today">Week ${w}<small>${shortDate(mon)} – ${shortDate(addDay(mon,6))}${mon===mondayOf(today())?'':' · tap for this week'}</small></button><button class="nav" data-act="wk-nav" data-d="1" aria-label="Next week">${I.right}</button></div>`;
  h+=runCard();
  h+=`<div class="stat"><div><span>Done</span><b>${hrs(st.done)}</b><small>of ${hrs(st.target)} h target</small></div><div><span>Planned</span><b>${hrs(st.plan)}</b><small>h${st.skipped?` · ${st.skipped} skipped`:''}</small></div></div>`;
  h+=`<div class="card"><h3>${I.target}Areas<span class="r">done / target</span></h3><div class="arealist">${st.list.filter(x=>x.plan||x.done||x.area.target).map(x=>{const a=x.area,t=(+a.target||0)*60,max=Math.max(t,x.plan,x.done,1);
    return `<div class="ar"><div class="lr"><span><i class="sw2" style="background:${a.color}"></i>${esc(a.name)}</span><b>${hrs(x.done)}${t?` / ${hrs(t)}`:''} h</b></div>
      <div class="bar2"><i class="p" style="width:${x.plan/max*100}%;background:${a.color}"></i><i class="d" style="width:${x.done/max*100}%;background:${a.color}"></i>${t?`<em style="left:${t/max*100}%"></em>`:''}</div></div>`;}).join('')||'<p class="muted">Nothing planned yet.</p>'}</div>
    <p class="muted small" style="margin-top:8px">Solid = done, light = planned, line = target.</p></div>`;
  // mini week grid
  const lo=6*60,hi=23*60;
  h+=`<div class="card"><h3>${I.day}The week</h3><div class="wgrid">${days.map(d=>{const bs=dayBlocks(d);
    return `<button class="wcol ${d===today()?'td':''}" data-act="day-pick" data-v="${d}"><small>${fmtD(d,{weekday:'short'})}</small><div class="wbar">${bs.map(b=>`<i class="${b.status}" style="top:${Math.max(0,(b.start-lo)/(hi-lo)*100)}%;height:${Math.max(1.5,b.dur/(hi-lo)*100)}%;background:${areaOf(b.area).color}"></i>`).join('')}</div><b>${hrs(bs.reduce((a,b)=>a+doneMin(b),0))}</b></button>`;}).join('')}</div></div>`;
  h+=`<div class="sec">Plan the week</div><div class="stack">
    <button class="btn small" data-act="wk-copy">${I.copy}Copy last week</button>
    <button class="btn small" data-act="tpl-apply">Use template</button>
    <button class="btn small" data-act="tpl-save">Save as template</button>
    <button class="btn small" data-act="wk-ics">${I.cal}Add to Calendar</button>
    <button class="btn small" data-act="areas">Areas & targets</button></div>`;
  return h;
}
function copyWeek(fromMon,toMon,list){
  let n=0;for(const b of list){const off=diffDays(b.day,fromMon);putRec('blocks',{id:uid(),day:addDay(toMon,off),start:b.start,dur:b.dur,area:b.area,title:b.title||'',status:'plan',actual:'',note:''});n++;}return n;
}

/* ---------- areas ---------- */
function areasView(){
  return {full:true,html:()=>{const as=areas();const tot=as.reduce((a,x)=>a+(+x.target||0),0);
    return `${head('Areas & weekly targets',{back:STACK.length>1})}<div class="sh-body">
      <p class="muted" style="margin-bottom:10px">Weekly targets in hours. Leave 0 for areas you track without a target. Total target: <b>${tot} h</b>.</p>
      <ul class="list">${as.map(a=>`<li><div class="it"><button class="swatch" style="background:${a.color}" data-act="ar-color" data-id="${a.id}" aria-label="Colour"></button>
        <input class="ar-name" data-id="${a.id}" value="${esc(a.name)}"><input class="ar-t mini" data-id="${a.id}" inputmode="decimal" value="${esc(a.target||0)}"><span class="muted small">h</span>
        <button class="icon-btn sm" data-act="ar-del" data-id="${a.id}" aria-label="Remove">${I.trash}</button></div></li>`).join('')}</ul>
      <button class="btn small" data-act="ar-add">+ Add area</button>
      <p class="hint" style="margin-top:10px">Tap a colour dot to change it. Removing an area keeps its past blocks.</p></div>`;},
  mount:()=>{$$('.ar-name').forEach(el=>el.addEventListener('change',()=>{const a=getRec('areas',el.dataset.id);a.name=el.value.trim()||a.name;putRec('areas',a);}));
    $$('.ar-t').forEach(el=>el.addEventListener('change',()=>{const a=getRec('areas',el.dataset.id);a.target=Math.max(0,num(el.value)||0);putRec('areas',a);refreshView();}));}};
}

/* ---------- review ---------- */
function reviewHtml(){
  const mon=VW.rmon||mondayOf(today()),key=weekKey(mon),r=getRec('reviews',key)||{},st=weekStats(mon),[,w]=isoWeek(mon);
  let h=`<div class="datebar"><button class="nav" data-act="rv-nav" data-d="-1" aria-label="Previous week">${I.left}</button><div class="dl">Review week ${w}<small>${shortDate(mon)} – ${shortDate(addDay(mon,6))}</small></div><button class="nav" data-act="rv-nav" data-d="1" aria-label="Next week" ${mon>=mondayOf(today())?'disabled':''}>${I.right}</button></div>`;
  const pct=st.plan?Math.round(st.done/st.plan*100):0;
  h+=`<div class="stat"><div><span>Done</span><b>${hrs(st.done)} h</b><small>${st.target?Math.round(st.done/st.target*100)+'% of target':''}</small></div><div><span>Plan kept</span><b>${st.plan?pct+'%':'–'}</b><small>${st.skipped?st.skipped+' skipped':''}</small></div></div>`;
  const hit=st.list.filter(x=>+x.area.target>0);
  if(hit.length)h+=`<div class="card"><div class="hitlist">${hit.map(x=>{const t=x.area.target*60,ok=x.done>=t*0.95,close=x.done>=t*0.7;return `<span class="hit ${ok?'ok':close?'close':'miss'}"><i style="background:${x.area.color}"></i>${esc(x.area.name)} ${hrs(x.done)}/${hrs(t)}</span>`;}).join('')}</div></div>`;
  h+=`<label class="fld"><span>What went well</span><textarea id="rv-wins" placeholder="Applications sent, interviews, a good gym week…">${esc(r.wins||'')}</textarea></label>
    <label class="fld"><span>What got in the way</span><textarea id="rv-block" placeholder="Be specific: what would you change?">${esc(r.blockers||'')}</textarea></label>
    <div class="sec">Energy this week</div>${chipRow('rv-energy',[[1,'1 · drained'],[2,'2'],[3,'3 · okay'],[4,'4'],[5,'5 · great']],r.energy||'')}
    <div class="sec" style="margin-top:16px">Focus for next week (up to 3)</div>
    ${[0,1,2].map(i=>`<label class="fld"><input id="rv-f${i}" value="${esc((r.focus||[])[i]||'')}" placeholder="${['e.g. 5 applications to public-sector roles','e.g. Two mock interviews in German','e.g. Gym Mon/Wed/Fri'][i]}"></label>`).join('')}
    <button class="btn primary" style="width:100%" data-act="rv-save">Save review</button>`;
  const past=live('reviews').filter(x=>x.id!==key).sort((a,b)=>a.id<b.id?1:-1).slice(0,12);
  if(past.length)h+=`<div class="sec" style="margin-top:20px">Earlier reviews</div><ul class="list">${past.map(x=>`<li><button class="it" data-act="rv-open" data-v="${x.mon}"><span class="nm"><b>Week ${x.id.slice(6)} · ${hrs(x.done||0)} h${x.energy?' · energy '+x.energy:''}</b><small>${esc((x.wins||'').split('\n')[0]||'–')}</small></span></button></li>`).join('')}</ul>`;
  return h;
}

/* ---------- trends ---------- */
function trendsHtml(){
  const n=S.settings.trendWeeks||8,cur=mondayOf(today()),mons=Array.from({length:n},(_,i)=>addDay(cur,-7*(n-1-i)));
  const stats=mons.map(m=>weekStats(m));const as=areas();
  if(!blocks().length)return `<div class="empty">Trends appear after your first week of blocks.</div>`;
  let h=`<div class="chips" style="margin-bottom:12px">${[4,8,12,26].map(k=>`<button class="chip ${n===k?'on':''}" data-act="tr-n" data-v="${k}">${k} weeks</button>`).join('')}</div>`;
  const W=340,H=170,pl=26,pb=18,pt=8,max=Math.max(1,...stats.map(s=>Math.max(s.done,s.target)))/60*1.1,bw=(W-pl)/n,Y=v=>pt+(H-pt-pb)*(1-v/max);
  let svg=`<svg class="chart" viewBox="0 0 ${W} ${H}">`;const step=max>40?10:max>16?5:2;
  for(let v=0;v<=max;v+=step)svg+=`<line class="gl" x1="${pl}" x2="${W}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${pl-4}" y="${Y(v)+3}" text-anchor="end">${v}</text>`;
  stats.forEach((s,i)=>{let y0=0;const x=pl+i*bw+bw*.18,w=bw*.64;for(const a of as){const v=(s.list.find(l=>l.area.id===a.id)||{done:0}).done/60;if(!v)continue;svg+=`<rect x="${x}" y="${Y(y0+v)}" width="${w}" height="${Y(y0)-Y(y0+v)}" fill="${a.color}"><title>${esc(a.name)}: ${hrs(v*60)} h</title></rect>`;y0+=v;}
    if(i%Math.ceil(n/8)===0||i===n-1)svg+=`<text x="${x+w/2}" y="${H-4}" text-anchor="middle">${isoWeek(mons[i])[1]}</text>`;});
  const tg=stats[stats.length-1].target/60;if(tg)svg+=`<line x1="${pl}" x2="${W}" y1="${Y(tg)}" y2="${Y(tg)}" stroke="var(--ink)" stroke-dasharray="4 3" opacity=".6"/>`;
  svg+='</svg>';
  h+=`<div class="card"><h3>Hours done per week<span class="r">dashed = target</span></h3>${svg}<div class="legend">${as.map(a=>`<span><i style="background:${a.color}"></i>${esc(a.name)}</span>`).join('')}</div></div>`;
  const full=stats.slice(0,-1).filter(s=>s.n);
  h+=`<div class="card"><h3>Average per week<span class="r">${full.length?`last ${full.length} full weeks`:'no full week yet'}</span></h3><ul class="facts">${as.map(a=>{const avg=full.length?full.reduce((t,s)=>t+((s.list.find(l=>l.area.id===a.id)||{done:0}).done),0)/full.length:0,t=(+a.target||0)*60;
    const met=full.filter(s=>t&&((s.list.find(l=>l.area.id===a.id)||{done:0}).done)>=t*0.95).length;
    return `<li><span><i class="sw2" style="background:${a.color}"></i>${esc(a.name)}</span><b>${hrs(avg)} h${t?` <small class="${avg>=t*0.95?'okc':avg>=t*0.7?'':'red'}">/ ${hrs(t)} · hit ${met}×</small>`:''}</b></li>`;}).join('')}</ul></div>`;
  const en=mons.map(m=>{const r=reviewFor(m);return r&&r.energy?+r.energy:null;});
  if(en.filter(Boolean).length>=2){const E=v=>8+(64)*(1-(v-1)/4);let s=`<svg class="chart" viewBox="0 0 ${W} 90">`;[1,3,5].forEach(v=>s+=`<line class="gl" x1="${pl}" x2="${W}" y1="${E(v)}" y2="${E(v)}"/><text x="${pl-4}" y="${E(v)+3}" text-anchor="end">${v}</text>`);
    const pts=en.map((v,i)=>v?[pl+i*bw+bw/2,E(v)]:null).filter(Boolean);s+=`<polyline fill="none" stroke="var(--acc)" stroke-width="2.5" points="${pts.map(p=>p.join(',')).join(' ')}"/>`+pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="var(--acc)"/>`).join('')+'</svg>';
    h+=`<div class="card"><h3>Energy (from reviews)</h3>${s}</div>`;}
  return h;
}

APP.main=tab=>tab==='week'?weekHtml():tab==='review'?reviewHtml():tab==='trends'?trendsHtml():dayHtml();
APP.mount=tab=>{if(tab==='day')dayMount();};
APP.onNewDay=()=>{VW.day=today();VW.mon=mondayOf(today());VW._scrolled=false;};
APP.init=()=>{
  if(!S.areas.length){DEFAULT_AREAS.forEach(([id,name,target,color],i)=>S.areas.push({id,name,target,color,order:i,updatedAt:1,by:''}));save();} // updatedAt 1: any real edit on another phone wins
  // a timer left running for more than 12 hours was almost certainly forgotten
  const r=S.settings.run;if(r&&Date.now()-r.t0>12*36e5){S.settings.run=null;save();setTimeout(()=>toast('A timer from over 12 hours ago was discarded'),800);}
};
APP.settingsTop=()=>`<div class="set-sec">Planner</div><ul class="list"><li><button class="it" data-act="areas"><span class="nm"><b>Areas & weekly targets</b><small>${areas().length} areas, ${areas().reduce((a,x)=>a+(+x.target||0),0)} h/week target</small></span>${I.right.replace('<svg','<svg style="width:18px;height:18px;color:var(--muted)"')}</button></li></ul>
  <div class="g2"><label class="fld"><span>Countdown label</span><input id="s-cl" value="${esc(S.settings.countLabel)}" placeholder="e.g. new job"></label><label class="fld"><span>Countdown date</span><input id="s-cd" type="date" value="${esc(S.settings.countDate)}"></label></div>
  <p class="hint">Shown in the header, e.g. "47 days to new job".</p>`;
APP.settingsMount=()=>{[['s-cl','countLabel'],['s-cd','countDate']].forEach(([id,k])=>{const el=$('#'+id);if(el)el.addEventListener('change',()=>{S.settings[k]=el.value.trim();save();renderHeader();});});};

function exportCsv(){
  const q=v=>{v=String(v??'');return /[",\n;]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
  const rows=[['date','week','start','end','area','what','status','planned_min','actual_min','note']];
  for(const b of blocks().sort((a,b)=>a.day<b.day?-1:a.day>b.day?1:a.start-b.start))rows.push([b.day,weekKey(b.day),hhmm(b.start),hhmm(b.start+b.dur),areaOf(b.area).name,b.title||'',b.status,b.dur,doneMin(b)||'',b.note||'']);
  shareFile(`cadence-${stamp()}.csv`,'﻿'+rows.map(r=>r.map(q).join(',')).join('\n'),'text/csv');
}

/* ---------- actions ---------- */
Object.assign(A,{
  'new-block':()=>{if(!areas().length)return pushView(areasView());newBlock({day:VIEW.tab==='day'?VW.day:(VW.mon===mondayOf(today())?today():VW.mon)});},
  blk:b=>editBlock(b.dataset.id),
  'bd-area':b=>{readBD();BD.area=pickChip(b);},
  'bd-dur':b=>{readBD();BD.dur=+pickChip(b);const el=$('#bd-dur');if(el)el.value='';},
  'bd-status':b=>{readBD();BD.status=b.dataset.v;refreshView();},
  'bd-copy':b=>{readBD();const v=b.dataset.v;BD.copyTo=BD.copyTo.includes(v)?BD.copyTo.filter(x=>x!==v):[...BD.copyTo,v];b.classList.toggle('on');},
  'bd-save':()=>saveBlock(),
  'bd-del':()=>{const id=BD.id;BD=null;closeSheet();delRec('blocks',id,'Block deleted');render();},
  'day-nav':b=>{VW.day=addDay(VW.day,+b.dataset.d);VW._scrolled=false;render();},
  'day-today':()=>{VW.day=today();VW._scrolled=false;render();},
  'day-pick':b=>{VW.day=b.dataset.v;VW._scrolled=false;VIEW.tab='day';render();},
  'day-alldone':()=>{const n=new Date(),nm=n.getHours()*60+n.getMinutes();let c=0;
    for(const b of dayBlocks(VW.day))if(b.status==='plan'&&(VW.day<today()||b.start+b.dur<=nm)){b.status='done';putRec('blocks',b);c++;}
    render();toast(c?`${plural(c,'block')} marked done`:'No past planned blocks');},
  'run-start':b=>startRun(b.dataset.v),'run-stop':()=>stopRun(),
  'wk-nav':b=>{VW.mon=addDay(VW.mon,7*+b.dataset.d);render();},
  'wk-today':()=>{VW.mon=mondayOf(today());render();},
  'wk-copy':()=>{const prev=addDay(VW.mon,-7),list=weekBlocks(prev);if(!list.length)return toast('Last week has no blocks.');
    if(weekBlocks(VW.mon).length&&!confirm('This week already has blocks. Add last week\'s blocks as well?'))return;
    const n=copyWeek(prev,VW.mon,list);render();toast(`${plural(n,'block')} copied as planned`);},
  'tpl-save':()=>{const list=weekBlocks(VW.mon);if(!list.length)return toast('This week has no blocks to save.');
    const name=prompt('Template name','Standard week');if(!name)return;
    putRec('templates',{id:uid(),name:name.trim(),blocks:list.map(b=>({wd:weekday(b.day),start:b.start,dur:b.dur,area:b.area,title:b.title||''}))});toast('Template saved');},
  'tpl-apply':()=>{const ts=live('templates');if(!ts.length)return toast('No templates yet: plan a good week, then "Save as template".');
    pushView({html:()=>`${head('Use template')}<div class="sh-body"><ul class="list">${ts.map(t=>`<li><div class="it"><button class="nm" data-act="tpl-use" data-id="${t.id}" style="text-align:left"><b>${esc(t.name)}</b><small>${plural(t.blocks.length,'block')} · ${hrs(t.blocks.reduce((a,b)=>a+b.dur,0))} h</small></button><button class="icon-btn sm" data-act="tpl-del" data-id="${t.id}" aria-label="Delete">${I.trash}</button></div></li>`).join('')}</ul>
      <p class="hint">Adds the template's blocks to week ${isoWeek(VW.mon)[1]} as planned.</p></div>`});},
  'tpl-use':b=>{const t=getRec('templates',b.dataset.id);for(const x of t.blocks)putRec('blocks',{id:uid(),day:addDay(VW.mon,x.wd),start:x.start,dur:x.dur,area:x.area,title:x.title,status:'plan',actual:'',note:''});closeSheet();toast(`${t.name}: ${plural(t.blocks.length,'block')} added`);},
  'tpl-del':b=>{if(!confirm('Delete this template?'))return;delRec('templates',b.dataset.id,false);refreshView();},
  'wk-ics':()=>{const evs=weekBlocks(VW.mon).filter(b=>b.status==='plan').map(b=>({uid:b.id,day:b.day,start:b.start,dur:b.dur,title:b.title||areaOf(b.area).name,desc:areaOf(b.area).name,alarms:[10]}));
    if(!evs.length)return toast('No planned blocks this week.');shareFile(`cadence-${weekKey(VW.mon)}.ics`,icsBuild(evs,'Cadence'),'text/calendar');},
  areas:()=>pushView(areasView()),
  'ar-add':()=>{const used=new Set(areas().map(a=>a.color));putRec('areas',{id:uid(),name:'New area',target:0,color:PALETTE.find(c=>!used.has(c))||PALETTE[0],order:areas().length});refreshView();},
  'ar-del':b=>{const a=getRec('areas',b.dataset.id);if(!confirm(`Remove ${a.name}? Past blocks keep it.`))return;a.deleted=true;putRec('areas',a);refreshView();},
  'ar-color':b=>{const a=getRec('areas',b.dataset.id);a.color=PALETTE[(PALETTE.indexOf(a.color)+1)%PALETTE.length];putRec('areas',a);refreshView();},
  'rv-nav':b=>{VW.rmon=addDay(VW.rmon||mondayOf(today()),7*+b.dataset.d);render();},
  'rv-open':b=>{VW.rmon=b.dataset.v;scrollMain(0);render();},
  'rv-energy':b=>{window._en=+pickChip(b);},
  'rv-save':()=>{const mon=VW.rmon||mondayOf(today()),key=weekKey(mon),old=getRec('reviews',key)||{},st=weekStats(mon);
    const r={...old,id:key,mon,wins:$('#rv-wins').value.trim(),blockers:$('#rv-block').value.trim(),energy:window._en||old.energy||'',focus:[0,1,2].map(i=>$('#rv-f'+i).value.trim()).filter(Boolean),done:st.done,plan:st.plan,target:st.target};
    window._en=null;putRec('reviews',r);vib();toast('Review saved. The focus shows on next week\'s days.');render();},
  'tr-n':b=>{S.settings.trendWeeks=+b.dataset.v;save();render();},
  csv:()=>exportCsv(),
  noop:()=>{},
});
coreStart();
